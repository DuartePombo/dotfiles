# The RTX 2060 stays powered on all the time (runtime D3 off), like the old setup.
# With runtime D3 (0x02) on nvidia-open 615.78.08, any suspend/resume cycle left the GPU without display
# interrupts: external monitors froze ("Flip event timeout") until reboot. The laptop is almost always on AC.
options nvidia "NVreg_DynamicPowerManagement=0x00"
