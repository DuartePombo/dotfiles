# kms is left out so nouveau stays out of the initramfs (the NVIDIA driver is used instead).
# i915 is loaded early instead, so the passphrase prompt uses Intel's display driver.
# keyboard comes before autodetect so all keyboard drivers are included, not only the ones in use at build
# time: an external USB keyboard (the Glove80, wired) then works at the passphrase prompt.
MODULES=(i915)
HOOKS=(base systemd keyboard autodetect microcode modconf sd-vconsole block sd-encrypt filesystems fsck)
