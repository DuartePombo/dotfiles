# The UGREEN dock's display chip (Silicon Motion "SMI USB Display") also shows up as a sound card. Nothing useful
# plays through it, but apps (Zoom) and PipeWire kept choosing it as the output: turn the card off entirely, so it
# never appears as an output or input. The laptop's built-in audio stays the default.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Silicon_Motion_SMI_USB_Display*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
