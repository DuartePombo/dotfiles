# The UGREEN dock's audio (Silicon Motion "SMI USB Display", analog out) has a higher priority (1109) than the
# laptop's built-in audio (1009), so it became the default output and sound went to the dock's jack.
# Rank it below the built-in output. Any output can still be picked in pavucontrol (WirePlumber remembers it).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-Silicon_Motion_SMI_USB_Display*" }
      { node.name = "~alsa_input.usb-Silicon_Motion_SMI_USB_Display*" }
    ]
    actions = {
      update-props = {
        priority.session = 500
        priority.driver = 500
      }
    }
  }
]
