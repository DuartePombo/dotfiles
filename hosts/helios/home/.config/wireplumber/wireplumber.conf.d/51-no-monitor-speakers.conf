# The NVIDIA card's audio (HDMI/DisplayPort: the monitors' own speakers, "TU106 High Definition Audio Controller").
# The user never wants sound from the monitors, but Zoom kept switching to them whenever a monitor's audio device
# came back (after the screens wake up): turn the card off entirely, so no app can pick it. Sound stays on the
# laptop (or Bluetooth headphones when connected).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_01_00.1" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
