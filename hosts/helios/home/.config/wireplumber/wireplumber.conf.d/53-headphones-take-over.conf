# Bluetooth headphones become the speaker and microphone whenever they connect, even after a manual pick
# (~/.local/share/wireplumber/scripts/headphones-take-over.lua). "optional": if the script ever fails to load,
# WirePlumber still starts (sound keeps working, only this behaviour is missing: journalctl --user -u wireplumber).
wireplumber.components = [
  {
    name = headphones-take-over.lua, type = script/lua
    provides = custom.headphones-take-over
  }
]

wireplumber.profiles = {
  main = {
    custom.headphones-take-over = optional
  }
}
