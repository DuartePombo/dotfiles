# hypridle: the screens switch off after 10 minutes without a key press or mouse movement (user's choice: the front
# monitor is an OLED, which can burn in and does its panel care in standby). Nothing locks or suspends by itself: a
# key or the mouse wakes the screens. Videos playing (YouTube in Chrome, mpv/Haruna) keep them on.
# Lock by hand with Alt+. or Super+L (hyprlock). Closing the lid still suspends (logind's default), and every suspend
# locks the screen first (before_sleep_cmd), so the laptop never wakes up unlocked.
# More listener blocks (dim, lock, suspend): see /usr/share/hypr/hypridle.conf for examples.

general {
    lock_cmd = pidof hyprlock || hyprlock                           # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                        # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screen on after resume without a key press
}

listener {
    timeout = 600                                                   # 10 minutes
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'   # all screens off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'     # back on at the first key or mouse movement
}
