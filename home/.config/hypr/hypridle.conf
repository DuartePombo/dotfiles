# hypridle: the screens turn black after 10 minutes without a key press or mouse movement (user's choice: the front
# monitor is an OLED, which can burn in). Nothing locks or suspends by itself: a key or the mouse brings them back.
# Videos playing (YouTube in Chrome, mpv/Haruna) keep them on.
# Black, not switched off (screen-blank, since 2026-11-28): waking screens from real power-off (DPMS) goes through the
# NVIDIA driver and froze the desktop (black screens until the power button). On the OLED black pixels are off, so
# burn-in protection is the same; its automatic panel care still runs whenever it loses the signal (shutdown, lid
# closed, the monitor's own power button), just not during idle.
# Lock by hand with Alt+. or Super+L (hyprlock). Closing the lid still suspends (logind's default), and every suspend
# locks the screen first (before_sleep_cmd), so the laptop never wakes up unlocked.
# More listener blocks (dim, lock, suspend): see /usr/share/hypr/hypridle.conf for examples.

general {
    lock_cmd = pidof hyprlock || hyprlock                           # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                        # lock before suspend
    after_sleep_cmd = screen-blank off                              # never wake up from suspend to black screens
}

listener {
    timeout = 600                                                   # 10 minutes
    on-timeout = screen-blank on                                    # all screens black
    on-resume = screen-blank off                                    # back at the first key or mouse movement
}
