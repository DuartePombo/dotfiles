# hypridle: no idle timers (user's choice): the screen never dims, blanks, locks or suspends by itself.
# Lock by hand with Alt+. (hyprlock). Closing the lid still suspends (logind's default), and every suspend locks
# the screen first (before_sleep_cmd), so the laptop never wakes up unlocked.
# To bring timers back, add listener blocks; see /usr/share/hypr/hypridle.conf for examples.

general {
    lock_cmd = pidof hyprlock || hyprlock                           # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                        # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screen on after resume without a key press
}
