# hypridle: what happens when you're idle. Based on /usr/share/hypr/hypridle.conf.
# 2.5 min dim, 5 min lock, 5.5 min screen off, 15 min suspend.
# Closing the lid suspends (logind's default) and, like every suspend, locks first (before_sleep_cmd).
# Video playback in apps that inhibit idle (browsers, players) pauses these timers.

general {
    lock_cmd = pidof hyprlock || hyprlock                           # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                        # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screen on after resume without a key press
}

listener {
    timeout = 150                                # 2.5 min
    on-timeout = brightnessctl -s set 10         # dim the panel
    on-resume = brightnessctl -r                 # restore brightness
}

listener {
    timeout = 300                                # 5 min
    on-timeout = loginctl lock-session           # lock
}

listener {
    timeout = 330                                                   # 5.5 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'   # screen off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'     # screen on
}

listener {
    timeout = 900                                # 15 min
    on-timeout = systemctl suspend               # suspend
}
