# Read by the google-chrome launcher (AUR package), one flag per line.
# Run natively on Wayland
--ozone-platform=wayland
# Store passwords and cookies in gnome-keyring (unlocked at login), not Chrome's weak "basic" store
--password-store=gnome-libsecret
# Don't offer to become the default browser: links go through open-link (work or personal Chrome), and
# accepting would replace it in mimeapps.list
--no-default-browser-check
