# tmux config. Prefix is the default, Ctrl+b.

set -g mouse on
set -g base-index 1              # windows and panes start at 1, like the keyboard
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000

# Neovim: no delay after Esc, focus events for autoread, true colour in Alacritty
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty:RGB,xterm-kitty:RGB"

# Copy mode with vi keys; y copies to the Wayland clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Move between panes with prefix + h/j/k/l (replaces the default prefix + l, last window)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# prefix + f: jump to a project session (tmux-sessionizer)
bind f display-popup -E "tmux-sessionizer"

# prefix + r: reload this file
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
