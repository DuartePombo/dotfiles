# tmux config. Prefix is the default, Ctrl+b.

set -g mouse on
set -g base-index 1              # windows and panes start at 1, like the keyboard
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000

# Neovim: no delay after Esc, focus events for autoread, true colour in Alacritty
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty:RGB,xterm-kitty:RGB"
# Shift+Enter (a new line in Claude Code) and other modified keys reach the programs that ask for them, instead of
# arriving as a plain Enter (Claude Code docs, "Configure tmux"). Takes effect after detaching and attaching again.
set -s extended-keys on
set -s extended-keys-format csi-u     # the form Claude Code and kitty use (tmux's default xterm form wasn't understood)
set -as terminal-features 'xterm*:extkeys'

# Copy mode with vi keys; y copies to the Wayland clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Move between panes with prefix + h/j/k/l (replaces the default prefix + l, last window)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# prefix + f: jump to a project session (tmux-sessionizer)
bind f display-popup -E "tmux-sessionizer"

# prefix + r: reload this file
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Look: the desktop's colours (Catppuccin Mocha, as in kitty) instead of tmux's bright green bar. Left: the session
# name in blue; middle: the windows, the current one in peach (like the active workspace in the desktop's bar);
# right: date and time. Pane borders grey, the active one peach; copy-mode selection as in kitty.
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#141420,bold] #S #[default] "
set -g status-right "#[fg=#a6adc8]%a %d %b  %H:%M "
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#a6adc8] #I #W#{?window_zoomed_flag, (zoom),} "
setw -g window-status-current-format "#[bg=#fab387,fg=#141420,bold] #I #W#{?window_zoomed_flag, (zoom),} "
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#fab387"
set -g message-style "bg=#1e1e2e,fg=#fab387"
set -g message-command-style "bg=#1e1e2e,fg=#fab387"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
set -g display-panes-colour "#89b4fa"
set -g display-panes-active-colour "#fab387"
setw -g clock-mode-colour "#89b4fa"

# Images in Neovim (image.nvim: Jupyter plots) are drawn with kitty's graphics protocol, passed through tmux
set -gq allow-passthrough on
set -g visual-activity off
