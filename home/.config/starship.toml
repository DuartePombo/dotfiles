# starship: the shell prompt, in every terminal (kitty, tmux, VS Code). The classic bash prompt, in colour:
#   (proposal-automation) duarte@helios proposal-automation (main*)$
# (environment) when one is active, user@machine folder, (git branch) inside a repository with * when there are
# uncommitted changes, then $: red when the last command failed. Catppuccin Mocha colours like the rest of the desktop.
# Reference: https://starship.rs/config/

"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
palette = "catppuccin_mocha"
format = '$conda$python$username$hostname$directory( \($git_branch${custom.dirty}\))$character'

# (proposal-automation): the active conda environment, as conda itself shows it
[conda]
style = "green"
format = '[\($environment\) ]($style)'

# (.venv): a project's own environment (uv, venv), only when one is active
[python]
style = "green"
format = '[(\($virtualenv\) )]($style)'
detect_extensions = []
detect_files = []
detect_folders = []

[username]
show_always = true
style_user = "subtext0"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "subtext0"
format = "[@$hostname]($style) "

# only the folder's own name, like bash's \W (~ at home)
[directory]
style = "bold blue"
truncation_length = 1
truncate_to_repo = false
read_only = " 󰌾"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style)"

[git_branch]
style = "mauve"
format = "[$branch]($style)"

# * = anything not committed yet (changed, staged or new files); one quick `git status` per prompt
[custom.dirty]
when = 'test -n "$(git status --porcelain --ignore-submodules 2>/dev/null | head -n 1)"'
require_repo = true
shell = ["bash", "--noprofile", "--norc"]
style = "mauve"
format = "[*]($style)"

[character]
success_symbol = '[\$](text)'
error_symbol = '[\$](bold red)'
format = "$symbol "

[palettes.catppuccin_mocha]
text = "#cdd6f4"
subtext0 = "#a6adc8"
red = "#f38ba8"
green = "#a6e3a1"
blue = "#89b4fa"
mauve = "#cba6f7"
