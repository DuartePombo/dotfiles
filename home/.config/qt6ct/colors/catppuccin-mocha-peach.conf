# Qt apps (Dolphin, Okular, Gwenview, Haruna, Kdenlive, the password prompt) in the desktop's colours: Catppuccin Mocha,
# peach for the selection, like the bar, the menus and VS Code. Used by qt6ct.conf (color_scheme_path).
# The 21 colours are Qt's palette roles, in this order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base (lists, file views), Window (around them), Shadow, Highlight (selection),
# HighlightedText, Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText, PlaceholderText.
