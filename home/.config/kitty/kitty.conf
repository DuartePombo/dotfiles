# kitty: the default terminal (Alt+Return). Chosen over Alacritty because it can show images, so Jupyter
# plots render inline in Neovim (image.nvim). Settings mirror the old Alacritty config.

font_family      JetBrainsMono Nerd Font
font_size        11.0

background_opacity 0.95

enable_audio_bell no
confirm_os_window_close 0

# kitty's own update check doesn't apply on Arch (pacman updates it)
update_check_interval 0
