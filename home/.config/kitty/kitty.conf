# kitty: the default terminal (Alt+Return). Chosen over Alacritty because it can show images, so Jupyter
# plots render inline in Neovim (image.nvim). Settings mirror the old Alacritty config.

font_family      JetBrainsMono Nerd Font
font_size        11.0
# A little more space between lines (like the VS Code work profile's line height)
modify_font cell_height 110%

# Breathing room: the text doesn't touch the window's edges
window_padding_width 8

# See-through, with Hyprland's blur behind it (decoration.blur in hyprland.lua): the plain shell shows the wallpaper
# softly. Neovim paints its own background, so code stays solid.
background_opacity 0.90

# Cursor trail: when the cursor jumps (gd, a search, Ctrl+o, another window), a quick faint flick shows where it went.
# decay = how fast it fades (seconds; kitty's default 0.1 0.4 lingered), colour = muted grey instead of the cursor's
# peach, start_threshold = cells it must move first (e.g. "20 8": only jumps of 20+ columns or 8+ lines).
cursor_trail 3
cursor_trail_decay 0.03 0.12
cursor_trail_color #585b70
cursor_trail_start_threshold 2

# Colours: a blue-black background, darker than the editors (Neovim's code #1a1b26, VS Code's #1e1e2e) and the same as
# the VS Code terminal (Neovim's own terminal window uses its file tree's #16161e instead). Text colours = Catppuccin Mocha,
# as in the VS Code terminal, so ls, git, fzf look the same in both. The peach cursor is the desktop's "active" colour.
background            #141420
foreground            #cdd6f4
cursor                #fab387
cursor_text_color     #141420
selection_background  #45475a
selection_foreground  none
url_color             #89b4fa
# black, red, green, yellow, blue, magenta, cyan, white; then the bright versions
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

enable_audio_bell no
confirm_os_window_close 0

# Hyprland decides window sizes. Remembering them (kitty's default) also remembers "maximized": after a maximized
# kitty (Alt+Shift+F) was closed, every new kitty started maximized and covered the other windows instead of tiling.
remember_window_size no

# kitty's own update check doesn't apply on Arch (pacman updates it)
update_check_interval 0

# Ctrl+Shift+F5 is Neovim's "restart debugging" (as in VS Code); kitty used it to reload this file
map kitty_mod+f5 no_op

# Ctrl+Shift+W closed the terminal (and whatever ran in it), one key from Ctrl+Shift+E: off. Alt+Q (Hyprland) closes
# any window. discard_event, not no_op: no_op would pass it on, and shells read it as Ctrl+W (delete a word).
map kitty_mod+w discard_event

# Shift+Enter always sends its own code (ESC [13;2u, the kitty-protocol form), so programs can tell it from Enter even
# inside tmux: tmux asks terminals for extended keys in an xterm way kitty doesn't support, and then only ever saw a
# plain Enter (Claude Code submitted instead of adding a line). tmux passes it on to programs that asked for it
# (Claude Code, Neovim) and gives the rest a plain Enter; bash outside tmux treats it as Enter (~/.inputrc).
map shift+enter send_text all \x1b[13;2u
